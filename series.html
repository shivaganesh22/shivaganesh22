<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotstar Series Episode Directory</title>
  <meta name="description" content="Browse and watch all episodes of Radha Krishna and Mahabharatham with direct episode links.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: #0f141f;
      --bg-card-hover: #161e2e;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(0, 210, 255, 0.4);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #00d2ff;
      --primary-glow: rgba(0, 210, 255, 0.15);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.15);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(0, 114, 210, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(245, 158, 11, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    /* Header */
    header {
      background: rgba(15, 20, 31, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0072d2, #00d2ff);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 210, 255, 0.3);
    }

    .logo-icon svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .logo-text h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Series Switcher Tabs */
    .series-nav {
      display: flex;
      background: rgba(7, 9, 14, 0.8);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
      gap: 6px;
    }

    .series-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .series-tab:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
    }

    .series-tab.active {
      color: #ffffff;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .series-tab.active.radha {
      border-color: rgba(0, 210, 255, 0.35);
      color: #00d2ff;
    }

    .series-tab.active.mahabharat {
      border-color: rgba(245, 158, 11, 0.35);
      color: #fbbf24;
    }

    .tab-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Series Banner info */
    .series-banner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 14px;
      padding: 18px 22px;
      border: 1px solid var(--border);
      gap: 16px;
    }

    .series-info h2 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .series-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .series-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-hotstar {
      background: linear-gradient(135deg, #0072d2, #00a3ff);
      color: #ffffff;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 114, 210, 0.35);
    }

    .btn-hotstar:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 114, 210, 0.5);
    }

    .btn-copy-all {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-copy-all:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-dim);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sort-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .sort-btn:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .stats-pill {
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Episodes Table */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
    }

    .ep-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .ep-table th {
      background: rgba(7, 9, 14, 0.95);
      padding: 14px 18px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .ep-row {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ep-row:hover {
      background: var(--bg-card-hover);
    }

    .ep-row td {
      padding: 16px 18px;
      vertical-align: middle;
      font-size: 14px;
    }

    .ep-tag {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 210, 255, 0.1);
      color: var(--primary);
      border: 1px solid rgba(0, 210, 255, 0.2);
      white-space: nowrap;
    }

    .mahabharat-theme .ep-tag {
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.25);
    }

    .ep-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .ep-duration {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .ep-date {
      font-size: 11px;
      color: var(--text-dim);
    }

    .ep-title-cell {
      max-width: 450px;
    }

    .ep-title {
      font-weight: 600;
      color: var(--text-main);
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ep-desc {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ep-watch-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(0, 210, 255, 0.08);
      color: var(--primary);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .ep-watch-link:hover {
      background: var(--primary);
      color: #07090e;
      border-color: var(--primary);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .mahabharat-theme .ep-watch-link {
      background: rgba(245, 158, 11, 0.08);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.25);
    }

    .mahabharat-theme .ep-watch-link:hover {
      background: #f59e0b;
      color: #07090e;
      border-color: #f59e0b;
      box-shadow: 0 4px 12px var(--gold-glow);
    }

    /* Load more / Infinite view */
    .pagination-bar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 9, 14, 0.8);
      border-top: 1px solid var(--border);
    }

    .btn-more {
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-more:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Empty state */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: var(--text-dim);
      margin-bottom: 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 860px) {
      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .series-nav {
        width: 100%;
        overflow-x: auto;
      }
      .series-tab {
        flex: 1;
        justify-content: center;
      }
      .ep-desc, .ep-date, .ep-id {
        display: none;
      }
    }
  </style>
</head>

    let currentSeriesKey = "radhakrishna";
    let sortAscending = true;
    let searchQuery = "";
    let displayedCount = 50;
    const PAGE_CHUNK = 50;

    function getActiveEpisodes() {
      const episodes = CATALOG[currentSeriesKey].episodes;
      let filtered = episodes;

      if (searchQuery) {
        const q = searchQuery.toLowerCase().trim();
        filtered = episodes.filter(ep => 
          (ep.episode_tag && ep.episode_tag.toLowerCase().includes(q)) ||
          (ep.title && ep.title.toLowerCase().includes(q)) ||
          (ep.content_id && ep.content_id.toLowerCase().includes(q)) ||
          (ep.description && ep.description.toLowerCase().includes(q))
        );
      }

      if (!sortAscending) {
        return [...filtered].reverse();
      }
      return filtered;
    }

    function switchSeries(key) {
      currentSeriesKey = key;
      displayedCount = PAGE_CHUNK;
      searchQuery = "";
      document.getElementById('search-input').value = "";

      const s = CATALOG[key];

      // Update Tabs
      document.querySelectorAll('.series-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab-' + key);
      if (activeTab) activeTab.classList.add('active');

      // Update Theme class
      const container = document.getElementById('table-container');
      if (key === 'mahabharatham') {
        container.classList.add('mahabharat-theme');
      } else {
        container.classList.remove('mahabharat-theme');
      }

      // Update Banner
      document.getElementById('series-title').textContent = s.title;
      document.getElementById('series-tagline').textContent = s.tagline;
      document.getElementById('btn-show-link').href = s.show_url;

      renderTable();
    }

    function toggleSort() {
      sortAscending = !sortAscending;
      document.getElementById('sort-label').textContent = sortAscending ? "Sort: Oldest First" : "Sort: Newest First";
      renderTable();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value;
      displayedCount = PAGE_CHUNK;
      renderTable();
    }

    function loadMore() {
      displayedCount += PAGE_CHUNK;
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('episodes-tbody');
      const allFiltered = getActiveEpisodes();
      const totalFiltered = allFiltered.length;
      const totalSeries = CATALOG[currentSeriesKey].episodes.length;

      document.getElementById('stats-counter').textContent = `${totalFiltered.toLocaleString()} / ${totalSeries.toLocaleString()} Episodes`;

      if (totalFiltered === 0) {
        tbody.innerHTML = '';
        document.getElementById('empty-state').style.display = 'block';
        document.getElementById('pagination-bar').style.display = 'none';
        return;
      }

      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('pagination-bar').style.display = 'flex';

      const slice = allFiltered.slice(0, displayedCount);

      let html = '';
      slice.forEach((ep) => {
        const epTag = ep.episode_tag || 'Ep';
        const epId = ep.content_id || '';
        const duration = ep.duration || '20m';
        const date = ep.release_date || '';
        const title = ep.title || 'Episode';
        const desc = ep.description || '';
        const url = ep.watch_url || `https://www.hotstar.com${ep.watch_path}`;

        html += `
          <tr class="ep-row" onclick="window.open('${url}', '_blank', 'noopener,noreferrer')">
            <td>
              <span class="ep-tag">${escapeHtml(epTag)}</span>
            </td>
            <td>
              <span class="ep-id" title="Click to copy ID" onclick="copyText('${epId}', event)">${epId}</span>
            </td>
            <td>
              <div class="ep-duration">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                ${duration}
              </div>
              <div class="ep-date">${escapeHtml(date)}</div>
            </td>
            <td class="ep-title-cell">
              <div class="ep-title">${escapeHtml(title)}</div>
              ${desc ? `<div class="ep-desc">${escapeHtml(desc)}</div>` : ''}
            </td>
            <td style="text-align: right;">
              <a href="${url}" target="_blank" rel="noopener noreferrer" class="ep-watch-link" onclick="event.stopPropagation()">
                <span>Watch</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
              </a>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;

      // Update pagination bar
      const shownNow = Math.min(displayedCount, totalFiltered);
      document.getElementById('page-info').textContent = `Showing 1 to ${shownNow.toLocaleString()} of ${totalFiltered.toLocaleString()} episodes`;

      const btnMore = document.getElementById('btn-load-more');
      if (displayedCount >= totalFiltered) {
        btnMore.style.display = 'none';
      } else {
        btnMore.style.display = 'inline-block';
        btnMore.textContent = `Load Next ${Math.min(PAGE_CHUNK, totalFiltered - displayedCount)} Episodes`;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function copyText(text, event) {
      if (event) event.stopPropagation();
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Copied ID: ${text}`);
      });
    }

    function copyAllLinks() {
      const episodes = CATALOG[currentSeriesKey].episodes;
      const links = episodes.map(ep => `${ep.episode_tag}\t${ep.content_id}\t${ep.title}\t${ep.watch_url}`).join('\n');
      navigator.clipboard.writeText(links).then(() => {
        showToast(`Copied ${episodes.length} episode links!`);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Initial render
    switchSeries(currentSeriesKey);
  </script>
